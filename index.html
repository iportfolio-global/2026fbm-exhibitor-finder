<!doctype html>
<title>FBM Exhibitor Finder</title>
<style>
  @font-face-fallback-note {}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#F2F3F6;
  --surface:#FFFFFF;
  --surface-alt:#FAFAFC;
  --ink:#1C2230;
  --ink-soft:#5B6472;
  --ink-faint:#8A93A3;
  --line:#DEE2E8;
  --line-strong:#C7CCD6;
  --accent:#7A2438;
  --accent-strong:#5E1B2B;
  --accent-soft:#F4E4E8;
  --accent-contrast:#FFFFFF;
  --genre:#2E7D32;
  --genre-soft:#E4F1E5;
  --products:#B45309;
  --products-soft:#FBEEDF;
  --expertise:#6D28D9;
  --expertise-soft:#EEE7FB;
  --shadow:rgba(28,34,48,0.10);
  --chip-shadow: 0 1px 2px rgba(28,34,48,0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14161C;
    --surface:#1B1E27;
    --surface-alt:#20232D;
    --ink:#E7E9EE;
    --ink-soft:#A8AFBC;
    --ink-faint:#757D8C;
    --line:#2B2F3A;
    --line-strong:#3A3F4D;
    --accent:#E28B9D;
    --accent-strong:#F0A9B8;
    --accent-soft:#3A2027;
    --accent-contrast:#1C2230;
    --genre:#7FDB87;
    --genre-soft:#1E2E20;
    --products:#E8A15C;
    --products-soft:#2E2418;
    --expertise:#BC9BF2;
    --expertise-soft:#271E3D;
    --shadow:rgba(0,0,0,0.4);
    --chip-shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#14161C;
  --surface:#1B1E27;
  --surface-alt:#20232D;
  --ink:#E7E9EE;
  --ink-soft:#A8AFBC;
  --ink-faint:#757D8C;
  --line:#2B2F3A;
  --line-strong:#3A3F4D;
  --accent:#E28B9D;
  --accent-strong:#F0A9B8;
  --accent-soft:#3A2027;
  --accent-contrast:#1C2230;
  --genre:#7FDB87;
  --genre-soft:#1E2E20;
  --products:#E8A15C;
  --products-soft:#2E2418;
  --expertise:#BC9BF2;
  --expertise-soft:#271E3D;
  --shadow:rgba(0,0,0,0.4);
  --chip-shadow:none;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.5;
}
.tnum{ font-variant-numeric: tabular-nums; }
::selection{ background:var(--accent-soft); }

a{ color: var(--accent); }
button{ font-family:inherit; }

/* ---- App shell ---- */
.app{
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:16px;
  padding:14px 22px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 var(--shadow);
}
.brand{
  display:flex; align-items:baseline; gap:10px; flex-shrink:0;
}
.brand-mark{
  font-family:"Fraunces","Georgia",serif;
  font-weight:700; font-size:20px; letter-spacing:0.2px;
  color:var(--ink);
}
.brand-sub{
  font-size:11.5px; color:var(--ink-faint);
  letter-spacing:0.06em; text-transform:uppercase;
  border-left:1px solid var(--line-strong); padding-left:10px;
  display:none;
}
@media (min-width:640px){ .brand-sub{ display:inline; } }

.search-wrap{
  flex:1; max-width:440px; position:relative;
}
.search-wrap input{
  width:100%;
  padding:9px 14px 9px 34px;
  border-radius:9px;
  border:1px solid var(--line-strong);
  background:var(--surface-alt);
  color:var(--ink);
  font-size:13.5px;
  outline:none;
}
.search-wrap input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.search-wrap svg{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-faint); pointer-events:none;
}

.topbar-right{
  margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.count-pill{
  font-family:"IBM Plex Mono",monospace;
  font-size:12.5px; color:var(--ink-soft);
  background:var(--surface-alt);
  border:1px solid var(--line);
  padding:6px 11px; border-radius:100px;
  white-space:nowrap;
}
.count-pill b{ color:var(--ink); font-weight:600; }

.btn{
  font-size:13px; font-weight:500;
  padding:7px 13px; border-radius:8px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn:active{ transform:translateY(1px); }
.btn-filter{ display:inline-flex; align-items:center; gap:6px; }
.btn-filter svg{ width:14px; height:14px; }

@media (min-width:960px){ .btn-filter{ display:none; } }

/* ---- Body layout ---- */
.body-grid{
  display:flex;
  flex:1;
  min-height:0;
}

.sidebar{
  width:296px; flex-shrink:0;
  border-right:1px solid var(--line);
  background:var(--surface);
  overflow-y:auto;
  padding:16px 16px 60px;
  align-self:flex-start;
  position:sticky;
  top:61px;
  height:calc(100vh - 61px);
}

.sidebar-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:4px;
}
.sidebar-head h2{
  font-family:"Fraunces",serif; font-size:15px; font-weight:600; margin:0;
  color:var(--ink);
}
.link-btn{
  background:none; border:none; color:var(--accent);
  font-size:12px; font-weight:500; cursor:pointer; padding:2px 0;
}
.link-btn:hover{ text-decoration:underline; }

.facet{
  margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
}
.facet:first-of-type{ margin-top:14px; }
.facet-title{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:9px;
}
.facet-mini{
  width:100%; padding:6px 10px; margin-bottom:9px;
  border-radius:7px; border:1px solid var(--line-strong);
  background:var(--surface-alt); color:var(--ink); font-size:12.5px; outline:none;
}
.facet-mini:focus{ border-color:var(--accent); }

.facet-list{
  max-height:190px; overflow-y:auto;
  display:flex; flex-direction:column; gap:1px;
  padding-right:2px;
}
.opt{
  display:flex; align-items:center; gap:8px;
  padding:4px 6px; border-radius:6px;
  cursor:pointer; font-size:13px; color:var(--ink);
}
.opt:hover{ background:var(--surface-alt); }
.opt input{ accent-color:var(--accent); width:14px; height:14px; flex-shrink:0; }
.opt .opt-count{
  margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint);
}

/* tag groups (accordion) */
.root-group{ margin-bottom:6px; }
.root-row{
  display:flex; align-items:center; gap:8px;
  padding:7px 6px; border-radius:7px;
}
.root-row:hover{ background:var(--surface-alt); }
.root-row input[type="checkbox"]{ accent-color:var(--accent); width:14px; height:14px; flex-shrink:0; cursor:pointer; }
.root-toggle{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:8px;
  background:none; border:none; cursor:pointer;
  padding:0; text-align:left;
}
.root-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.root-toggle span.name{ font-size:13px; font-weight:600; color:var(--ink); }
.root-toggle .n{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint); }
.root-toggle .chev{ width:12px; height:12px; color:var(--ink-faint); transition:transform .15s; flex-shrink:0; }
.root-group.open .chev{ transform:rotate(90deg); }
.root-body{ display:none; padding:2px 4px 8px 8px; }
.root-group.open .root-body{ display:block; }
.sub-group-row{
  display:flex; align-items:center; gap:7px;
  padding:5px 6px 2px; cursor:pointer;
  margin-top:6px;
}
.sub-group-row:first-child{ margin-top:2px; }
.sub-group-row input[type="checkbox"]{ accent-color:var(--accent); width:12px; height:12px; flex-shrink:0; cursor:pointer; }
.sub-group-name{
  font-size:11px; font-weight:600; color:var(--ink-faint);
  text-transform:uppercase; letter-spacing:0.03em;
}

.tag-opt{
  display:flex; align-items:center; gap:7px;
  padding:3px 6px 3px 25px; border-radius:6px; cursor:pointer;
  font-size:12.5px; color:var(--ink);
}
.tag-opt:hover{ background:var(--surface-alt); }
.tag-opt input{ accent-color:var(--accent); width:13px; height:13px; flex-shrink:0; }
.tag-opt .opt-count{ margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-faint); }

/* ---- Main / results ---- */
.main{
  flex:1; min-width:0;
  padding:20px 26px 80px;
}

.active-filters{
  display:flex; flex-wrap:wrap; gap:6px;
  margin-bottom:14px;
}
.pill-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:500;
  padding:5px 6px 5px 11px; border-radius:100px;
  background:var(--accent-soft); color:var(--accent-strong);
  border:1px solid transparent;
}
.pill-chip button{
  background:none; border:none; cursor:pointer; color:inherit;
  display:flex; align-items:center; padding:2px; opacity:0.75;
}
.pill-chip button:hover{ opacity:1; }

.result-head{
  display:grid;
  grid-template-columns: 2fr 1fr 1fr 2.2fr 1.4fr 96px;
  gap:14px;
  padding:0 14px 9px;
  border-bottom:1px solid var(--line-strong);
  font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase;
  color:var(--ink-faint);
}
@media (max-width:900px){ .result-head{ display:none; } }

.rows{ display:flex; flex-direction:column; }
.row{
  display:grid;
  grid-template-columns: 2fr 1fr 1fr 2.2fr 1.4fr 96px;
  gap:14px;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  align-items:start;
}
.row:hover{ background:var(--surface); }
@media (max-width:900px){
  .row{
    grid-template-columns: 1fr;
    gap:6px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    background:var(--surface);
  }
  .rows{ gap:0; }
  .cell-label{ display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-right:6px; min-width:64px;}
}
.cell-label{ display:none; }
@media (max-width:900px){ .cell-label{ display:inline-block; } }

.co-name{ font-weight:600; color:var(--ink); font-size:13.5px; }
.hh-badge{
  display:inline-block; margin-left:7px; font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:100px; vertical-align:middle;
  background:var(--accent-soft); color:var(--accent-strong); cursor:help;
}
.hh-badge.hh2{ background:var(--surface-alt,#eee); color:var(--ink-soft); }
.hh-hint{ font-size:11px; color:var(--ink-faint); line-height:1.4; padding:6px 0 2px; }
.co-cat{ font-size:12.5px; color:var(--ink-soft); }
.co-nat{ font-size:12.5px; color:var(--ink-soft); }

.tag-chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  font-size:11px; font-weight:500;
  padding:3px 9px; border-radius:100px;
  white-space:nowrap;
  box-shadow: var(--chip-shadow);
}
.chip.genre{ background:var(--genre-soft); color:var(--genre); }
.chip.products{ background:var(--products-soft); color:var(--products); }
.chip.expertise{ background:var(--expertise-soft); color:var(--expertise); }
.chip.more{ background:var(--surface-alt); color:var(--ink-faint); border:1px solid var(--line); }
.no-tags{ font-size:12px; color:var(--ink-faint); font-style:italic; }

.links{ display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
.link-a{
  font-size:12px; font-weight:500; text-decoration:none;
  display:inline-flex; align-items:center; gap:4px;
  color:var(--accent);
}
.link-a:hover{ text-decoration:underline; }
.link-a svg{ width:11px; height:11px; }
.link-none{ color:var(--ink-faint); font-size:12px; }
.email-cell{ display:flex; align-items:flex-start; }
.email-a{ word-break:break-all; }

.empty-state{
  padding:60px 20px; text-align:center; color:var(--ink-faint);
}
.empty-state .big{ font-family:"Fraunces",serif; font-size:18px; color:var(--ink-soft); margin-bottom:6px; }

.sentinel{ height:1px; }
.loading-more{ text-align:center; padding:16px; font-size:12px; color:var(--ink-faint); }

/* sidebar overlay (mobile) */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.35);
  z-index:39; display:none;
}
@media (max-width:959px){
  .sidebar{
    position:fixed; top:0; left:0; height:100vh;
    transform:translateX(-100%);
    transition:transform .2s ease;
    z-index:40;
    box-shadow:2px 0 24px rgba(0,0,0,0.2);
  }
  .sidebar.open{ transform:translateX(0); }
  .overlay.show{ display:block; }
}

.sidebar-close{
  display:none;
  background:none; border:none; cursor:pointer;
  color:var(--ink-faint); padding:4px;
}
@media (max-width:959px){ .sidebar-close{ display:inline-flex; } }

.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap;
}

:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; }
}
</style>

<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('fbm-data').textContent);
  const TAGS = DATA.tags;          // [{name, group, root}]
  const CATEGORIES = DATA.categories;
  const NATIONALITIES = DATA.nationalities;
  const ROWS = DATA.rows;          // [name, catIdx, natIdx, website, detailUrl, [tagIdx,...], email, hhScore|null, hhSignals, hhStars|null]

  const ROOT_ORDER = ["Genre","Products","Expertise & Focus"];
  const ROOT_CLASS = {"Genre":"genre","Products":"products","Expertise & Focus":"expertise"};
  const ROOT_LABEL = {"Genre":"Genre","Products":"Products","Expertise & Focus":"Expertise & Focus"};

  // ---- precompute counts ----
  const tagCounts = new Array(TAGS.length).fill(0);
  const catCounts = {};
  const natCounts = {};
  ROWS.forEach(r=>{
    const [name, catIdx, natIdx, web, detail, tidxs] = r;
    if(catIdx>=0) catCounts[catIdx]=(catCounts[catIdx]||0)+1;
    if(natIdx>=0) natCounts[natIdx]=(natCounts[natIdx]||0)+1;
    tidxs.forEach(ti=> tagCounts[ti]++);
  });

  // ---- group tags by root -> group ----
  const rootMap = {};
  TAGS.forEach((t,i)=>{
    const root = ROOT_ORDER.includes(t.root) ? t.root : "Expertise & Focus";
    if(!rootMap[root]) rootMap[root] = {};
    if(!rootMap[root][t.group]) rootMap[root][t.group] = [];
    rootMap[root][t.group].push(i);
  });

  // ---- state ----
  const state = {
    search: "",
    cats: new Set(),
    nats: new Set(),
    tags: new Set(),
    hhOnly: false,
  };

  const RENDER_BATCH = 40;
  let filteredRows = [];
  let renderedCount = 0;

  // ---- build sidebar: categories ----
  const categoryList = document.getElementById('categoryList');
  CATEGORIES.forEach((c,i)=>{
    const label = document.createElement('label');
    label.className='opt';
    label.innerHTML = `<input type="checkbox" data-cat="${i}"><span>${escapeHtml(c)}</span><span class="opt-count tnum">${catCounts[i]||0}</span>`;
    categoryList.appendChild(label);
  });
  categoryList.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.cat===undefined) return;
    const idx = Number(t.dataset.cat);
    if(t.checked) state.cats.add(idx); else state.cats.delete(idx);
    applyFilters();
  });

  // ---- build sidebar: nationalities ----
  const nationalityList = document.getElementById('nationalityList');
  function renderNationalities(filterText){
    nationalityList.innerHTML = "";
    const ft = (filterText||"").toLowerCase();
    NATIONALITIES.forEach((n,i)=>{
      if(ft && n.toLowerCase().indexOf(ft)===-1) return;
      const label = document.createElement('label');
      label.className='opt';
      const checked = state.nats.has(i) ? 'checked' : '';
      label.innerHTML = `<input type="checkbox" data-nat="${i}" ${checked}><span>${escapeHtml(n)}</span><span class="opt-count tnum">${natCounts[i]||0}</span>`;
      nationalityList.appendChild(label);
    });
  }
  renderNationalities("");
  nationalityList.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.nat===undefined) return;
    const idx = Number(t.dataset.nat);
    if(t.checked) state.nats.add(idx); else state.nats.delete(idx);
    applyFilters();
  });
  document.getElementById('natFilterInput').addEventListener('input', e=>{
    renderNationalities(e.target.value);
  });

  // ---- build sidebar: tag groups (accordion, with cascading select-all) ----
  const tagGroupsEl = document.getElementById('tagGroups');
  const rootTagIndices = {};   // root -> [tagIdx,...]
  const groupTagIndices = {};  // "root||group" -> [tagIdx,...]
  const groupKey = (root, group) => root + '||' + group;

  ROOT_ORDER.forEach(root=>{
    const groups = rootMap[root];
    if(!groups) return;
    const allIdxs = [];
    Object.values(groups).forEach(idxs=> idxs.forEach(i=> allIdxs.push(i)));
    rootTagIndices[root] = allIdxs;
    let rootCount = 0;
    allIdxs.forEach(i=> rootCount += tagCounts[i]);

    const wrap = document.createElement('div');
    wrap.className = 'root-group';
    const cls = ROOT_CLASS[root];
    wrap.innerHTML = `
      <div class="root-row">
        <input type="checkbox" class="root-check" data-root="${root}" aria-label="${ROOT_LABEL[root]} 전체 선택">
        <button class="root-toggle" type="button">
          <span class="root-dot" style="background:var(--${cls})"></span>
          <span class="name">${ROOT_LABEL[root]}</span>
          <span class="n tnum">${rootCount}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
      </div>
      <div class="root-body"></div>
    `;
    const body = wrap.querySelector('.root-body');
    Object.keys(groups).forEach(groupName=>{
      groupTagIndices[groupKey(root, groupName)] = groups[groupName];
      const gRow = document.createElement('label');
      gRow.className = 'sub-group-row';
      gRow.innerHTML = `<input type="checkbox" class="group-check" data-root="${root}" data-group="${escapeAttr(groupName)}"><span class="sub-group-name">${escapeHtml(groupName)}</span>`;
      body.appendChild(gRow);
      groups[groupName].forEach(ti=>{
        const t = TAGS[ti];
        const label = document.createElement('label');
        label.className = 'tag-opt';
        label.innerHTML = `<input type="checkbox" data-tag="${ti}"><span>${escapeHtml(t.name)}</span><span class="opt-count tnum">${tagCounts[ti]}</span>`;
        body.appendChild(label);
      });
    });
    wrap.querySelector('.root-toggle').addEventListener('click', ()=>{
      wrap.classList.toggle('open');
    });
    tagGroupsEl.appendChild(wrap);
  });

  function setTagsChecked(idxs, checked){
    idxs.forEach(i=>{ if(checked) state.tags.add(i); else state.tags.delete(i); });
  }

  // keep root/group/tag checkboxes in the sidebar in sync with state.tags
  // (checked = all descendants selected, indeterminate = some but not all)
  function syncTagCheckboxes(){
    tagGroupsEl.querySelectorAll('input[data-tag]').forEach(el=>{
      el.checked = state.tags.has(Number(el.dataset.tag));
    });
    tagGroupsEl.querySelectorAll('.group-check').forEach(el=>{
      const idxs = groupTagIndices[groupKey(el.dataset.root, el.dataset.group)] || [];
      const n = idxs.filter(i=> state.tags.has(i)).length;
      el.checked = idxs.length>0 && n===idxs.length;
      el.indeterminate = n>0 && n<idxs.length;
    });
    tagGroupsEl.querySelectorAll('.root-check').forEach(el=>{
      const idxs = rootTagIndices[el.dataset.root] || [];
      const n = idxs.filter(i=> state.tags.has(i)).length;
      el.checked = idxs.length>0 && n===idxs.length;
      el.indeterminate = n>0 && n<idxs.length;
    });
  }

  tagGroupsEl.addEventListener('change', e=>{
    const t = e.target;
    if(t.classList.contains('root-check')){
      setTagsChecked(rootTagIndices[t.dataset.root] || [], t.checked);
    } else if(t.classList.contains('group-check')){
      setTagsChecked(groupTagIndices[groupKey(t.dataset.root, t.dataset.group)] || [], t.checked);
    } else if(t.dataset.tag!==undefined){
      const idx = Number(t.dataset.tag);
      if(t.checked) state.tags.add(idx); else state.tags.delete(idx);
    } else {
      return;
    }
    syncTagCheckboxes();
    applyFilters();
  });

  // ---- search ----
  let searchTimer=null;
  document.getElementById('searchInput').addEventListener('input', e=>{
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(()=>{ state.search = v.trim().toLowerCase(); applyFilters(); }, 120);
  });

  // ---- clear all ----
  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    state.search=""; state.cats.clear(); state.nats.clear(); state.tags.clear(); state.hhOnly=false;
    document.getElementById('searchInput').value = "";
    document.getElementById('hhOnlyToggle').checked = false;
    document.querySelectorAll('#categoryList input, #nationalityList input, #tagGroups input').forEach(el=>{
      el.checked=false; el.indeterminate=false;
    });
    applyFilters();
  });

  // ---- mobile sidebar toggle ----
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  document.getElementById('openFilters').addEventListener('click', openSidebar);
  document.getElementById('closeFilters').addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);

  // ---- active filter pills ----
  // Tag pills are aggregated: a fully-selected root shows one pill ("Genre"),
  // a fully-selected group shows one pill ("Fiction"), and only the leftover
  // individually-checked tags get their own pill.
  function renderActiveFilters(){
    const wrap = document.getElementById('activeFilters');
    wrap.innerHTML = "";
    const items = [];
    state.cats.forEach(i=> items.push({type:'cat', idx:i, label: CATEGORIES[i]}));
    state.nats.forEach(i=> items.push({type:'nat', idx:i, label: NATIONALITIES[i]}));

    const consumed = new Set();
    ROOT_ORDER.forEach(root=>{
      const idxs = rootTagIndices[root];
      if(!idxs || idxs.length===0) return;
      if(idxs.every(i=> state.tags.has(i))){
        items.push({type:'root-tags', root, label: ROOT_LABEL[root]});
        idxs.forEach(i=> consumed.add(i));
        return;
      }
      const groups = rootMap[root];
      Object.keys(groups).forEach(groupName=>{
        const gIdxs = groups[groupName];
        if(gIdxs.every(i=> state.tags.has(i))){
          items.push({type:'group-tags', root, group: groupName, label: groupName});
          gIdxs.forEach(i=> consumed.add(i));
        }
      });
    });
    state.tags.forEach(i=>{
      if(!consumed.has(i)) items.push({type:'tag', idx:i, label: TAGS[i].name});
    });

    items.forEach(it=>{
      const chip = document.createElement('span');
      chip.className='pill-chip';
      chip.innerHTML = `<span>${escapeHtml(it.label)}</span><button aria-label="제거">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>`;
      chip.querySelector('button').addEventListener('click', ()=>{
        if(it.type==='cat'){ state.cats.delete(it.idx); document.querySelector(`#categoryList input[data-cat="${it.idx}"]`).checked=false; }
        if(it.type==='nat'){ state.nats.delete(it.idx); const el=document.querySelector(`#nationalityList input[data-nat="${it.idx}"]`); if(el) el.checked=false; }
        if(it.type==='tag'){ state.tags.delete(it.idx); }
        if(it.type==='group-tags'){ setTagsChecked(groupTagIndices[groupKey(it.root, it.group)] || [], false); }
        if(it.type==='root-tags'){ setTagsChecked(rootTagIndices[it.root] || [], false); }
        syncTagCheckboxes();
        applyFilters();
      });
      wrap.appendChild(chip);
    });
  }

  // ---- filtering ----
  function applyFilters(){
    const s = state.search;
    const hasCat = state.cats.size>0;
    const hasNat = state.nats.size>0;
    const hasTag = state.tags.size>0;
    filteredRows = ROWS.filter(r=>{
      const [name, catIdx, natIdx, web, detail, tidxs, email, hhScore] = r;
      if(state.hhOnly && (hhScore===null || hhScore===undefined)) return false;
      if(s && name.toLowerCase().indexOf(s)===-1) return false;
      if(hasCat && !state.cats.has(catIdx)) return false;
      if(hasNat && !state.nats.has(natIdx)) return false;
      if(hasTag){
        let match=false;
        for(let i=0;i<tidxs.length;i++){ if(state.tags.has(tidxs[i])){ match=true; break; } }
        if(!match) return false;
      }
      return true;
    });
    if(state.hhOnly){
      filteredRows = filteredRows.slice().sort((a,b)=> (b[9]||0) - (a[9]||0) || (b[7]||0) - (a[7]||0));
    }
    document.getElementById('countShown').textContent = filteredRows.length.toLocaleString();
    renderActiveFilters();
    resetAndRender();
  }

  // ---- rendering (batched / infinite scroll) ----
  const rowsEl = document.getElementById('rows');
  const emptyState = document.getElementById('emptyState');
  const loadingMore = document.getElementById('loadingMore');

  function chipHtml(tidx){
    const t = TAGS[tidx];
    const cls = ROOT_CLASS[ROOT_ORDER.includes(t.root)?t.root:"Expertise & Focus"];
    return `<span class="chip ${cls}" title="${escapeHtml(t.group)}">${escapeHtml(t.name)}</span>`;
  }

  function rowHtml(r){
    const [name, catIdx, natIdx, web, detail, tidxs, email, hhScore, hhSignals, hhStars] = r;
    const cat = catIdx>=0 ? CATEGORIES[catIdx] : "—";
    const nat = natIdx>=0 ? NATIONALITIES[natIdx] : "—";
    let tagsHtml;
    if(tidxs.length===0){
      tagsHtml = `<span class="no-tags">태그 없음</span>`;
    } else {
      const shown = tidxs.slice(0,5).map(chipHtml).join("");
      const extra = tidxs.length>5 ? `<span class="chip more">+${tidxs.length-5}</span>` : "";
      tagsHtml = `<div class="tag-chips">${shown}${extra}</div>`;
    }
    let linksHtml = "";
    if(web){
      const href = /^https?:\/\//i.test(web) ? web : ("https://"+web);
      linksHtml += `<a class="link-a" href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer">웹사이트 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`;
    }
    if(detail){
      linksHtml += `<a class="link-a" href="${escapeAttr(detail)}" target="_blank" rel="noopener noreferrer">FBM 프로필 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`;
    }
    if(!linksHtml) linksHtml = `<span class="link-none">—</span>`;

    const emailHtml = email
      ? `<a class="link-a email-a" href="mailto:${escapeAttr(email)}">${escapeHtml(email)}</a>`
      : `<span class="link-none">—</span>`;

    return `<div class="row">
      <div><span class="cell-label">회사명</span><span class="co-name">${escapeHtml(name)}</span>${(hhScore!==null && hhScore!==undefined) ? `<span class="hh-badge${hhStars!==3 ? ' hh2':''}" title="${escapeAttr(hhSignals||'')}">${hhStars===3 ? '★★★ ' : (hhStars===2 ? '★★ ' : '')}HH ${hhScore}</span>` : ""}</div>
      <div><span class="cell-label">카테고리</span><span class="co-cat">${escapeHtml(cat)}</span></div>
      <div><span class="cell-label">국가</span><span class="co-nat">${escapeHtml(nat)}</span></div>
      <div><span class="cell-label">태그</span>${tagsHtml}</div>
      <div class="email-cell"><span class="cell-label">이메일</span>${emailHtml}</div>
      <div class="links"><span class="cell-label">링크</span>${linksHtml}</div>
    </div>`;
  }

  function resetAndRender(){
    rowsEl.innerHTML = "";
    renderedCount = 0;
    emptyState.style.display = filteredRows.length===0 ? "block" : "none";
    renderMore();
  }

  function renderMore(){
    if(renderedCount >= filteredRows.length){ loadingMore.style.display="none"; return; }
    const next = filteredRows.slice(renderedCount, renderedCount+RENDER_BATCH);
    const html = next.map(rowHtml).join("");
    rowsEl.insertAdjacentHTML('beforeend', html);
    renderedCount += next.length;
    loadingMore.style.display = renderedCount < filteredRows.length ? "block" : "none";
  }

  const sentinel = document.getElementById('sentinel');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) renderMore(); });
  }, { rootMargin: "600px 0px" });
  io.observe(sentinel);

  // ---- helpers ----
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  document.getElementById('countTotal').textContent = ROWS.length.toLocaleString();
  const hhCount = ROWS.filter(r => r[7] !== null && r[7] !== undefined).length;
  document.getElementById('hhOnlyCount').textContent = hhCount.toLocaleString();
  document.getElementById('hhOnlyToggle').addEventListener('change', (e)=>{
    state.hhOnly = e.target.checked;
    applyFilters();
  });

  // initial
  applyFilters();
})();
</script>
